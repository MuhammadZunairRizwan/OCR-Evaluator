services:
  - type: web
    name: ocr-cer-wer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://your-app.vercel.app
